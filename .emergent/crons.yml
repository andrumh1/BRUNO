crons:
  - name: publish-scheduled
    description: "Publica las publicaciones programadas cuya fecha ya llegó (cada 15 min)"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/publish-scheduled"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-digest
    description: "Resumen IA matutino de los grupos más activos (8:00 UTC-5 = 13:00 UTC)"
    cron: "0 13 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-digest"
    method: POST
    enabled: true
  - name: poll-reminders
    description: "Avisa a quienes no han votado cuando una encuesta está por cerrarse y cierra las vencidas (cada hora)"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/poll-reminders"
    method: POST
    enabled: true
  - name: live-reminders
    description: "Avisa 10 min antes a quienes pidieron recordatorio de un live programado (cada 5 min)"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/live-reminders"
    method: POST
    enabled: true
